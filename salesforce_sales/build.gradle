plugins {
    id 'java-library'
    id 'jacoco'
    id("org.sonarqube") version "6.3.1.5724"
}

jar.archiveBaseName = "salesforce_sales"
group = 'app.krista.extensions.crm.sales'

sonar {
    properties {
        property('sonar.projectName', 'SonarScanner for Krista Global Catalog (salesforce_sales with Jacoco code coverage)')
        property("sonar.projectKey", "sonar-scanner-salesforce_sales")
        property("sonar.sources", "src/main/java")
        property("sonar.tests", "src/test/java")
        property("sonar.java.binaries", "build/classes/java/main")
        property("sonar.java.test.binaries", "build/classes/java/test")
        property("sonar.coverage.jacoco.xmlReportPaths", "build/reports/jacoco/test/jacocoTestReport.xml")
        property("sonar.junit.reportPaths", "build/test-results/test")
    }
}
tasks.test {
    // Generate coverage report after tests run
    finalizedBy(tasks.jacocoTestReport)
}
jacoco {
    toolVersion = "0.8.11"
}
tasks.jacocoTestReport {
    dependsOn(tasks.test)
    reports {
        xml.required = true   // Required for SonarQube
        html.required = true  // Useful for local viewing
        csv.required = false
    }
}
// Ensure Sonar runs only after JaCoCo report generation
tasks.named("sonar") {
    dependsOn(tasks.jacocoTestReport)
}

/*
 * Use extension.name for archiveBaseName, extension.version for version.
 * Resulting jar: <extension.name>-<extension.version>.jar e.g. Salesforce customer service-2.0.13.jar
 */
def computedBaseName = "salesforce_sales"
def computedVersion = "local"

compileJava.dependsOn clean

tasks.register("setReleaseProperties") {
    dependsOn("generateReleaseProperties")
    doFirst {
        def releasePropsFile = file("release.properties")
        if (releasePropsFile.exists()) {
            def props = new Properties()
            releasePropsFile.withInputStream { stream -> props.load(stream) }
            computedBaseName = (props['extension.name'] ?: computedBaseName).replaceAll(/\s+/, "")
            computedVersion = props['extension.version'] ?: computedVersion

            System.setProperty("extensionVersion", computedVersion)
            ext.set("finalBaseName", computedBaseName)
            version = computedVersion

            println "✔ Loaded extension name = ${computedBaseName}, version = ${computedVersion}"
        } else {
            logger.warn("⚠ release.properties not found; using default values.")
            ext.set("finalBaseName", computedBaseName)
            version = computedVersion
        }
    }
}

if (rootProject.file('builder.txt').canRead()) {
    ext.buildnr = rootProject.file('builder.txt').text.trim()
} else {
    ext.buildnr = "0"
}
def buildnrProvider = provider { ext.buildnr }

tasks.register('updateVersion') {
    doFirst {
        def currentBuildnr = buildnrProvider.get()
        def newbuildnr = Integer.parseInt(currentBuildnr) + 1
        print "Building extension version: " + version.toString() + "-" + newbuildnr
        rootProject.file('builder.txt').text = newbuildnr.toString()
        System.clearProperty("extensionVersion")
        System.setProperty("extensionVersion", version.toString() + "-" + newbuildnr)
    }
}

System.setProperty("extensionVersion", version.toString())

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

// Add compiler options to show deprecation warnings
tasks.withType(JavaCompile) {
    options.compilerArgs += ['-Xlint:deprecation']
}

repositories {
    mavenLocal()
    maven {
        url = "https://packages.cicd.in.antbrains.com/artifactory/libs-release"
    }
    mavenCentral()
}

configurations {
    implementation {
        canBeConsumed = false
    }
    // Create a resolvable configuration for the jar task
    jarClasspath {
        extendsFrom implementation
        canBeConsumed = false
        canBeResolved = true
    }
}

dependencies {
    annotationProcessor 'app.krista:extension-impl-anno-processors:1.0.118'
    implementation 'app.krista:krista-apis:1.0.118'
    implementation 'org.glassfish.hk2:hk2-api:3.0.3'
    implementation 'com.github.scribejava:scribejava-apis:8.3.3'
    implementation 'com.googlecode.libphonenumber:libphonenumber:5.5'
    implementation 'org.glassfish.jersey.media:jersey-media-multipart:2.35'
    implementation 'org.json:json:20210307'

    testImplementation 'com.kristasoft.common:common-test:1.0.48'
}

tasks.register('createSourceDir', Exec) {
    dependsOn processResources
    commandLine "mkdir", "-p", "$projectDir/build/classes/java/main/META-INF/project"
}

tasks.register('copyGradleFile', Exec) {
    dependsOn createSourceDir
    commandLine "cp", "$projectDir/build.gradle", "$projectDir/build/classes/java/main/META-INF/project/build.gradle"
}

tasks.register('includeSources', Exec) {
    dependsOn copyGradleFile
    commandLine "cp", "-r", "$projectDir/src", "$projectDir/build/classes/java/main/META-INF/project/src"
}

import java.util.regex.Pattern

/*
    Task to generate release.properties files in below format.
    extension.version=<version>
    extension.name=<name>
    domain.name=<domain>
    ecosystem.name=<ecosystem>
    Every extension developer should update extensionFile and areaFileName with relative path.
 */

tasks.register('generateReleaseProperties') {
    group = 'build'
    description = 'Generates release.properties file with extension version and domain information'

    doLast {
        def extensionFilePath = 'src/main/java/app/krista/extensions/crm/sales/salesforce_sales/SalesforceSalesExtension.java'
        def accountManagementAreaFilePath = 'src/main/java/app/krista/extensions/crm/sales/salesforce_sales/catalog/AccountsManagementArea.java'
        def actionAreaFilePath = 'src/main/java/app/krista/extensions/crm/sales/salesforce_sales/catalog/ActionsArea.java'
        def assetsManagementAreaFilePath = 'src/main/java/app/krista/extensions/crm/sales/salesforce_sales/catalog/AssetsManagementArea.java'
        def contentAreaFilePath = 'src/main/java/app/krista/extensions/crm/sales/salesforce_sales/catalog/ContentArea.java'
        def ForecastingAreaFilePath = 'src/main/java/app/krista/extensions/crm/sales/salesforce_sales/catalog/ForecastingArea.java'
        def leadsManagementAreaFilePath = 'src/main/java/app/krista/extensions/crm/sales/salesforce_sales/catalog/LeadsManagementArea.java'
        def opportunitiesManagementAreaFilePath = 'src/main/java/app/krista/extensions/crm/sales/salesforce_sales/catalog/OpportunitiesManagementArea.java'
        def quotesManagementAreaFilePath = 'src/main/java/app/krista/extensions/crm/sales/salesforce_sales/catalog/QuotesManagementArea.java'
        def RequestsAreaFilePath = 'src/main/java/app/krista/extensions/crm/sales/salesforce_sales/catalog/RequestsArea.java'
        def TaskManagementAreaFilePath = 'src/main/java/app/krista/extensions/crm/sales/salesforce_sales/catalog/TaskManagementArea.java'
        def WeeklyForecastingAreaFilePath = 'src/main/java/app/krista/extensions/crm/sales/salesforce_sales/catalog/WeeklyForecastingArea.java'

        def extensionFile = file(extensionFilePath)
        def accountManagementAreaFile = file(accountManagementAreaFilePath)
        def actionAreaFile = file(actionAreaFilePath)
        def assetsManagementAreaFile = file(assetsManagementAreaFilePath)
        def contentAreaFile = file(contentAreaFilePath)
        def ForecastingAreaFile = file(ForecastingAreaFilePath)
        def leadsManagementAreaFile = file(leadsManagementAreaFilePath)
        def opportunitiesManagementAreaFile = file(opportunitiesManagementAreaFilePath)
        def quotesManagementAreaFile = file(quotesManagementAreaFilePath)
        def RequestsAreaFile = file(RequestsAreaFilePath)
        def TaskManagementAreaFile = file(TaskManagementAreaFilePath)
        def WeeklyForecastingAreaFile = file(WeeklyForecastingAreaFilePath)

        if (!extensionFile.exists()) {
            throw new GradleException("Extension file not found: ${extensionFilePath}")
        }
        // Check that at least one area file exists
        if (!accountManagementAreaFile.exists() && !actionAreaFile.exists() && !assetsManagementAreaFile.exists() &&
                !contentAreaFile.exists() && !ForecastingAreaFile.exists() && !leadsManagementAreaFile.exists() &&
                !opportunitiesManagementAreaFile.exists() && !quotesManagementAreaFile.exists() && !RequestsAreaFile.exists() &&
                !TaskManagementAreaFile.exists() && !WeeklyForecastingAreaFile.exists()) {
            throw new GradleException("None of the area files found. At least one must exist.")
        }

        def properties = new Properties()
        // Pre-compile the regex pattern for better performance
        def keyValuePattern = Pattern.compile(/(\w+)\s*=\s*"([^"]+)"/)

        // Extract Extension annotation information
        extractAnnotationInfo(extensionFile, "@Extension", keyValuePattern) { key, value ->
            if (key == "version") {
                properties.setProperty("extension.version", value)
                logger.lifecycle("Found extension version: ${value}")
            } else if (key == "name") {
                properties.setProperty("extension.name", value)
                logger.lifecycle("Found extension name: ${value}")
            }
        }

        // Set default extension name if not found
        if (!properties.getProperty('extension.name')) {
            properties.setProperty("extension.name", "Salesforce sales")
            logger.lifecycle("Set default extension name: Salesforce sales")
        }

        // Try to extract Domain annotation information from all area files
        def domainFound = false
        def ecosystemFound = false

        // Check each area file if it exists
        [accountManagementAreaFile, actionAreaFile, assetsManagementAreaFile, contentAreaFile, ForecastingAreaFile,
         leadsManagementAreaFile, opportunitiesManagementAreaFile, quotesManagementAreaFile, RequestsAreaFile,
         TaskManagementAreaFile, WeeklyForecastingAreaFile].each { areaFile ->
            if (areaFile.exists()) {
                extractAnnotationInfo(areaFile, "@Domain", keyValuePattern) { key, value ->
                    if (key == "name" && !domainFound) {
                        properties.setProperty("domain.name", value)
                        logger.lifecycle("Found domain name: ${value} from ${areaFile.name}")
                        domainFound = true
                    } else if (key == "ecosystemName" && !ecosystemFound) {
                        properties.setProperty("ecosystem.name", value)
                        logger.lifecycle("Found ecosystem name: ${value} from ${areaFile.name}")
                        ecosystemFound = true
                    }
                }
            }
        }

        if (!properties.getProperty('extension.version')) {
            throw new GradleException("Could not find extension version in ${extensionFilePath}")
        }

        // Set default values if not found in annotations
        if (!properties.getProperty('domain.name')) {
            properties.setProperty("domain.name", "Sales")
            logger.lifecycle("Set default domain name: Sales")
        }

        if (!properties.getProperty('ecosystem.name')) {
            properties.setProperty("ecosystem.name", "CRM")
            logger.lifecycle("Set default ecosystem name: CRM")
        }

        def releasePropertiesFile = file('release.properties')
        def content = properties.collect { key, value -> "${key}=${value}" }.join('\n')
        releasePropertiesFile.text = content + '\n'
        logger.lifecycle("Generated release.properties with content:\n${content}")
    }
}

def extractAnnotationInfo(File file, String annotationName, Pattern keyValuePattern, Closure processProperty) {
    StringBuilder annotationText = new StringBuilder()
    boolean inAnnotation = false
    file.eachLine { line ->
        line = line.trim()
        if (line.contains(annotationName)) {
            inAnnotation = true
            annotationText.setLength(0) // Reset the buffer when starting a new annotation
            annotationText.append(line)
        } else if (inAnnotation) {
            annotationText.append(line)
        }

        if (inAnnotation && line.contains(")")) {
            inAnnotation = false
            def matcher = keyValuePattern.matcher(annotationText.toString())
            while (matcher.find()) {
                def key = matcher.group(1)
                def value = matcher.group(2)
                processProperty.call(key, value)
            }
        }
    }
}

tasks.named("jar") {
    dependsOn tasks.named("generateReleaseProperties")
}


jar {
    manifest {
    }
    // This task ensures that release.properties is read *after* it has been generated.
    // Gradle's configuration phase runs before tasks like `generateReleaseProperties` execute,
    // so directly reading the release.properties file earlier results in missing or default values.
    dependsOn tasks.named("setReleaseProperties")
    archiveBaseName = project.ext.has("finalBaseName") ? project.ext.finalBaseName : "salesforce_sales"
    manifest {}
    from {
        configurations.jarClasspath.collect {
            it.isDirectory() ? it : zipTree(it)
        }
    }
    exclude 'META-INF/*.RSA', 'META-INF/*.SF', 'META-INF/*.DSA'
    duplicatesStrategy = "exclude"
}

// JaCoCo configuration for test coverage
jacoco {
    toolVersion = "0.8.11"
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                    '**/api/**',
                    '**/util/Constants.class'
            ])
        }))
    }
}

test.finalizedBy jacocoTestReport
